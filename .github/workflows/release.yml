# Build VoiceCleaner with MSVC on a Windows runner, run the unit tests, and package a ready-to-run zip.
#
#   * push to main / claude/** branches, or a manual run -> build + test + zip as a workflow ARTIFACT
#     (download it from the run's summary page). Never creates a release.
#   * push of a version tag (v1.2.0, v1.2.0-rc1, ...)   -> also creates the GitHub Release and attaches
#     the zip. A tag containing '-' (e.g. -rc1) is published as a PRE-release.
#   * a release published from the GitHub UI             -> builds that tag and attaches the zip to it.
#   * manual run with `release_tag` set (e.g. v1.3)      -> builds the selected branch and creates that
#     tag + GitHub Release on the built commit (no local tag push needed). Pre-release if it contains '-'.
name: release

on:
  push:
    branches: ['main', 'claude/**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag on the built commit (e.g. v1.3). Leave empty for a build-only run."
        required: false
        default: ""

# The tag a run publishes: the pushed/released tag, or the manual release_tag input ('' = build only).
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}

permissions:
  contents: write   # create the release + upload the asset

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # No explicit -G: on Windows CMake defaults to the newest installed Visual Studio generator, so
      # the workflow survives runner image upgrades (windows-latest moved past VS 2022).
      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64

      # Builds every target (UI, worker, offline tools, all test executables). The voicecleaner
      # target's post-build step co-locates the worker exe, onnxruntime.dll, models/dfn3 and the
      # default settings.toml next to voicecleaner.exe.
      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $src = "build/src/voicecleaner/Release"
          $pkg = "VoiceCleaner-$ver-win-x64"
          New-Item -ItemType Directory -Path $pkg | Out-Null
          foreach ($f in 'voicecleaner.exe','voicecleaner-worker.exe','onnxruntime.dll','settings.toml') {
            if (-not (Test-Path "$src/$f")) { throw "missing build output: $src/$f" }
            Copy-Item "$src/$f" $pkg
          }
          Copy-Item -Recurse "$src/models" "$pkg/models"
          Copy-Item LICENSE $pkg

          # The project links the dynamic MSVC runtime (/MD). Ship the runtime DLLs app-local so the
          # zip runs on machines without the VC++ 2015-2022 redistributable installed.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
                 Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "MSVC CRT redist directory not found" }
          Copy-Item "$($crt.FullName)\*.dll" $pkg

          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"
          "PKG_ZIP=$pkg.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -Recurse $pkg | Select-Object FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: voicecleaner-win-x64
          path: ${{ env.PKG_ZIP }}

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}   # a new tag is created on exactly the commit that was built
          name: VoiceCleaner ${{ env.RELEASE_TAG }}
          files: ${{ env.PKG_ZIP }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
