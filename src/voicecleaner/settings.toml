# VoiceCleaner settings — shipped default (Phase 4a schema).
#
# REAL-TIME latency: buffered delay ~= ring_frames x 5 ms (8 ~= 40 ms, 16 ~= 80 ms, 512 ~= 2.5 s).
# Editable in-app: the LATENCY box (clamped 4..512) writes this and restarts the worker.
# Low-latency mode (in-app checkbox / [global].low_latency) also drops RNNoise's ~30 ms engine-delay pin.
# The mic picker in the app fills active_capture_id / render_id and writes the per-mic profile;
# with them blank, the app opens to the pickers and does not spawn the worker.

[global]
active_capture_id = ""
render_id         = ""
ring_frames       = 8

# One [mic."<wasapi-id>"] profile per microphone is written by the app, e.g.:
# [mic."{0.0.1.00000000}.{...}"]
# name         = "fifine Microphone (K688)"
# engine       = "rnnoise"   # "none" | "rnnoise" | "dfn3"
# warm_standby = false
# dsp_chain    = true
