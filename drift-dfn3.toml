# drift-dfn3.toml — Gate C: live DeepFilterNet3 (_ll) real-time budget test.
# Same K688 -> CABLE Input pair as drift.toml, but with the DFN3 engine + full DSP chain on.
capture_device_id = "{0.0.1.00000000}.{5fbcc184-0d7f-4ddc-81ed-7218eda75f1d}"   # Microphone (fifine Microphone), 48k mono
render_device_id  = "{0.0.0.00000000}.{59cf8297-d805-4b98-8233-ea97c8076b4d}"   # CABLE Input (VB-Audio Virtual Cable), 48k
ring_frames       = 1024        # deep ring so drift can't rail it; occupancy trend reveals budget overrun
csv_path          = "dfn3_drift.csv"

engine             = "dfn3"     # real-time DeepFilterNet3 (_ll streaming), models/dfn3-ll
dsp_chain          = true       # DC -> engine -> HPF -> VAD-gated AGC -> limiter
drift_compensation = true       # adaptive resampler holds Ring B occupancy flat
